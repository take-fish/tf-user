spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  application:
    name: tf-user
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:nacos:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        fail-fast: false
        metadata:
          version: ${APP_VERSION:dev}
          git-commit: ${GIT_COMMIT:unknown}
      config:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        group: FM
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_user}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_user_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

server:
  port: 8101
  shutdown: graceful

app:
  # 运行环境标识：生产/测试栈分别设置为 production/test，登录页和中台会明确展示
  environment: ${APP_ENV:production}
  version: ${APP_VERSION:dev}

fm:
  # 用户中台是身份事实来源，不能再经过统一鉴权拦截器调用自己
  auth:
    enabled: false
  # 头像写入本地命名卷；生产/测试由编排挂载 /app/data/files
  storage:
    enabled: ${FM_STORAGE_ENABLED:true}
    base-dir: ${FM_STORAGE_BASE_DIR:./data/files}
    max-file-bytes: ${FM_STORAGE_MAX_BYTES:8388608}
  common:
    error:
      service-unavailable-code: USER_UNAVAILABLE
      service-unavailable-message: 用户服务暂不可用
  user:
    session-ttl-hours: ${USER_SESSION_TTL_HOURS:168}
    avatar:
      max-bytes: ${USER_AVATAR_MAX_BYTES:2097152}
    admin:
      username: ${USER_ADMIN_USERNAME:admin}
      password: ${USER_ADMIN_PASSWORD:}
      # 生产默认关闭启动时自动同步；测试/首次初始化显式设为 true
      seed-enabled: ${USER_ADMIN_SEED_ENABLED:false}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
