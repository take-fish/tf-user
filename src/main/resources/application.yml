spring:
  application:
    name: tf-user
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:10.28.13.214:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        fail-fast: false
      config:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        group: FM
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.28.13.214}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_user}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:10.28.13.214}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      encoding: UTF-8

server:
  port: 8101

fm:
  user:
    session-ttl-hours: ${USER_SESSION_TTL_HOURS:168}
    admin:
      username: ${USER_ADMIN_USERNAME:admin}
      password: ${USER_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
